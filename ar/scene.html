<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Exploradores — realidade aumentada</title>
<link rel="stylesheet" href="../styles/tokens.css">
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;font:16px var(--font-body);color:var(--ink);background:transparent}#gestures{position:fixed;inset:0;z-index:4;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}#standalone{display:none;position:fixed;inset:auto max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));z-index:6;max-height:45%;overflow-y:auto;background:var(--surface-warm);padding:12px;border-radius:var(--radius-card)}#standalone p{margin:0 0 8px;line-height:1.4}button,a,summary{touch-action:manipulation}button,a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:44px;padding:0 12px;background:var(--tint);color:var(--ink);border:1px solid var(--border-control);border-radius:var(--radius-button);font:inherit;text-decoration:none;margin:3px}summary{display:list-item;min-height:44px;align-content:center;font-weight:650;cursor:pointer}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:3px}#start{position:fixed;inset:25% 10% auto;z-index:7;background:var(--warm-soft);padding:24px;border-radius:var(--radius-card);text-align:center}#points{position:fixed;inset:0;z-index:5;pointer-events:none}.point-pin{position:absolute;left:0;top:0;box-sizing:border-box;width:44px;height:44px;min-width:44px;min-height:44px;margin:0;padding:0;border:2px solid var(--ink);border-radius:50%;background:var(--surface);color:var(--ink);font-weight:750;box-shadow:0 2px 8px #0005;pointer-events:auto}.point-pin[aria-pressed=true]{background:var(--ink);color:var(--surface);border-color:var(--surface)}.point-pin[hidden]{display:none}a-scene{position:absolute;inset:0}
  #front-video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#102940}
  .front-mode a-scene{z-index:1;width:100%;height:100%}
  .front-mode #gestures:focus-visible,#spatial-gestures:focus-visible{outline:3px solid var(--focus);outline-offset:-4px}
  #spatial-start[hidden],#spatial-tracking[hidden]{display:none}
  #spatial-tracking{position:absolute;bottom:max(12px,env(safe-area-inset-bottom));left:12px;right:12px;margin:0;padding:.5rem .75rem;background:var(--surface-warm);border-radius:1rem}
  #spatial-start,#spatial-error{position:fixed;z-index:6;left:12px;top:12px}
  #spatial-error{top:64px;right:12px;padding:.5rem .75rem;background:var(--surface-warm);border-radius:1rem}
  #spatial-overlay{position:fixed;inset:0;z-index:8;background:transparent}
  #spatial-gestures{position:absolute;inset:0;touch-action:none;user-select:none}
  .spatial-controls{position:absolute;top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));left:max(12px,env(safe-area-inset-left));display:flex;justify-content:space-between;gap:.5rem;pointer-events:none}
  .spatial-controls button{pointer-events:auto;background:var(--surface-warm)}
</style>
<script src="../vendor/aframe-1.6.0.min.js"></script></head>
<body><video id="front-video" hidden muted playsinline></video><button type="button" id="spatial-start" hidden disabled>Fixar no ambiente</button><p id="spatial-error" role="status" hidden>Não foi possível fixar no ambiente. O modelo continua disponível na câmera.</p><div id="spatial-overlay" hidden><div id="spatial-gestures"></div><p id="spatial-tracking" role="status" hidden>Mova o celular devagar para o modelo aparecer.</p><div class="spatial-controls"><button type="button" id="spatial-reset">Trazer à frente</button><button type="button" id="spatial-close">Sair da RA</button></div></div><div id="gestures" aria-label="Arraste para girar o modelo; use dois dedos para ampliar e girar"></div><div id="points" role="group" aria-label="Pontos de interesse no modelo"></div><section id="standalone"><p id="status" role="status">Preparando a câmera…</p><p><a href="../fontes.html" target="_blank" rel="noopener">Fontes do relevo</a></p><div id="point-detail" role="status" hidden></div><details><summary>Usar botões para mover o modelo</summary><div><button data-action="plus" aria-label="Ampliar modelo">＋</button><button data-action="minus" aria-label="Reduzir modelo">−</button><button data-action="rotate">Girar</button><button data-action="reset">Restaurar</button></div></details><a id="back">Ver sem câmera / Voltar</a></section><script type="module" src="./scene.js?v=front-placement-2"></script></body></html>
